<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="sg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071026"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <linearGradient id="sg-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="sg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sg-bg)"/>

  <!-- Grid Blueprint Background Lines -->
  <g stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
  </g>

  <!-- Locker Chassis Outer Frame -->
  <rect x="130" y="25" width="140" height="150" rx="12" fill="#0b1736" stroke="url(#sg-cyan)" stroke-width="2" filter="url(#sg-glow)"/>

  <!-- Top Compartment (Tier 1) -->
  <rect x="145" y="40" width="110" height="42" rx="6" fill="#13234d" stroke="#00f5ff" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- Keypad Display -->
  <rect x="155" y="48" width="50" height="26" rx="4" fill="#080e21" stroke="#00f5ff" stroke-width="1"/>
  <circle cx="165" cy="56" r="2" fill="#00f5ff"/>
  <circle cx="175" cy="56" r="2" fill="#00f5ff"/>
  <circle cx="185" cy="56" r="2" fill="#00f5ff"/>
  <circle cx="195" cy="56" r="2" fill="#00f5ff"/>
  <circle cx="165" cy="66" r="2" fill="#00f5ff"/>
  <circle cx="175" cy="66" r="2" fill="#00f5ff"/>
  <circle cx="185" cy="66" r="2" fill="#00f5ff"/>
  <circle cx="195" cy="66" r="2" fill="#00f5ff"/>

  <!-- Biometric Scanner Ring -->
  <circle cx="230" cy="61" r="12" fill="#0a1329" stroke="#00f5ff" stroke-width="1.5"/>
  <circle cx="230" cy="61" r="6" stroke="#00f5ff" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="230" cy="61" r="2" fill="#10b981"/>

  <!-- Divider Line -->
  <line x1="145" y1="92" x2="255" y2="92" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Lower Compartment (Tier 2 - Secure Storage) -->
  <rect x="145" y="102" width="110" height="58" rx="6" fill="#0e1b3d" stroke="#00f5ff" stroke-width="1"/>
  <circle cx="200" cy="131" r="14" fill="#080e21" stroke="url(#sg-cyan)" stroke-width="1.5"/>
  <path d="M196 128 L200 124 L204 128 L200 138 Z" fill="#00f5ff"/>

  <!-- Dimension Indicator Lines -->
  <line x1="115" y1="25" x2="115" y2="175" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="110" y1="25" x2="120" y2="25" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="110" y1="175" x2="120" y2="175" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="105" y="105" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end" opacity="0.6">PORTABLE</text>

  <!-- Engineering Annotation Badge -->
  <rect x="285" y="85" width="85" height="28" rx="6" fill="#080f24" stroke="#00f5ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="327" y="102" fill="#00f5ff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SMARTGUARD</text>
  <line x1="255" y1="61" x2="285" y2="99" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1"/>
</svg>
